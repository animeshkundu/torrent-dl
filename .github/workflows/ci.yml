# .github/workflows/ci.yml
#
# Continuous Integration workflow for torrent-dl
#
# Triggers: Push to main/master, Pull requests to main/master
# Jobs: lint, test (matrix), security
#
# Related docs: docs/agent-instructions/03-tooling-and-pipelines.md

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/**'
  workflow_dispatch:  # Allow manual triggers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install linting tools
        run: pip install ruff black

      - name: Run Ruff linter
        run: ruff check --output-format=github .
        continue-on-error: true  # Don't fail on existing lint issues

      - name: Check code formatting with Black
        run: black --check --diff .
        continue-on-error: true  # Don't fail on existing format issues

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtorrent-rasterbar-dev python3-libtorrent || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=Pyflix --cov-report=xml --cov-report=term-missing || echo "No tests found yet"
        continue-on-error: true  # Don't fail if no tests exist yet

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        if: matrix.python-version == '3.11'
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r Pyflix -f json -o bandit-results.json || true
          bandit -r Pyflix -f txt || true
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt || true
          safety check --full-report || true
        continue-on-error: true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-results.json
        if: always()
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  validate:
    name: Full Validation
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions: {}
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          
          # For now, just report status - don't fail the build
          # Uncomment below to enforce all checks
          # if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
          #   exit 1
          # fi
          
          echo "CI validation complete"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1117"/>
      <stop offset="100%" style="stop-color:#121820"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9873a"/>
      <stop offset="100%" style="stop-color:#daa054"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle accent orbs -->
  <circle cx="200" cy="150" r="200" fill="#c9873a" opacity="0.08" filter="blur(80px)"/>
  <circle cx="1000" cy="500" r="180" fill="#3d8b8b" opacity="0.06" filter="blur(60px)"/>
  
  <!-- Play icon -->
  <g transform="translate(500, 200)">
    <circle cx="100" cy="100" r="60" fill="#151d28" stroke="#2a3545" stroke-width="2"/>
    <polygon points="85,70 85,130 130,100" fill="url(#accentGrad)"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="600" fill="#e8e9eb">torrent-dl</text>
  
  <!-- Subtitle -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#9ba3af">Watch and download torrents simultaneously</text>
  
  <!-- Badge -->
  <rect x="500" y="480" width="200" height="36" rx="18" fill="#151d28" stroke="#2a3545" stroke-width="1"/>
  <text x="600" y="504" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ba3af">Python Library</text>
</svg>
